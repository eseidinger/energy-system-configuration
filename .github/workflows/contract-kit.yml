name: Contract kit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
          working-directory: contract-kit
      - name: Validate the kit
        working-directory: contract-kit
        run: uv run --frozen pytest -q
      - name: Read the reviewed platform revision
        id: platform
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          baseline = json.loads(Path('contract-kit/platform/baseline.json').read_text())
          revision = baseline['revision']
          assert re.fullmatch(r'[0-9a-f]{40}', revision)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'revision={revision}\n')
          PY
      - name: Check out the reviewed platform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: eseidinger/developer-platform
          ref: ${{ steps.platform.outputs.revision }}
          path: upstream-platform
          persist-credentials: false
      - name: Check generated schema and source pins
        run: python3 contract-kit/tools/build_platform_snapshot.py upstream-platform --check
      - name: Validate the release archive independently
        run: |
          python3 contract-kit/tools/build_release.py
          cd dist
          sha256sum --check SHA256SUMS
          version=$(cat ../contract-kit/VERSION)
          tar -xzf "contract-kit-v${version}.tar.gz"
          cd "contract-kit-v${version}/contract-kit"
          uv run --frozen pytest -q
