openapi: 3.1.0
info:
  title: ODIP immutable dataset publication API
  version: 1.0.0
  description: Domain-neutral discovery and retrieval of published dataset versions.
servers:
  - url: https://odip.example.invalid
security:
  - keycloak: [dataset.read]
paths:
  /api/v1/datasets:
    get:
      operationId: listPublishedDatasets
      parameters:
        - name: status
          in: query
          schema: {type: string, const: PUBLISHED}
        - name: schemaRef
          in: query
          schema: {type: string, format: uri}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of immutable publication manifests.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/datasets/{datasetId}/versions/{version}:
    get:
      operationId: getDatasetPublication
      parameters:
        - $ref: '#/components/parameters/DatasetId'
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The immutable publication manifest.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: ../schemas/dataset-publication-v1.schema.json}
        '304':
          description: The supplied ETag still identifies the immutable version.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/datasets/{datasetId}/versions/{version}/artifacts/{artifactId}:
    get:
      operationId: getDatasetArtifact
      parameters:
        - $ref: '#/components/parameters/DatasetId'
        - $ref: '#/components/parameters/Version'
        - name: artifactId
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z][a-z0-9-]{1,99}$'}
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Immutable artifact bytes in the media type declared by the manifest.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {}
            application/octet-stream:
              schema: {type: string, contentEncoding: binary}
        '304':
          description: The supplied ETag still identifies the immutable artifact.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    keycloak:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://identity.example.invalid/realms/energy-system/protocol/openid-connect/token
          scopes:
            dataset.read: Read allow-listed published datasets and artifacts.
  parameters:
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z][a-z0-9-]{2,99}$'}
    Version:
      name: version
      in: path
      required: true
      schema:
        type: string
        pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    PageSize:
      name: pageSize
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: {type: string}
  headers:
    ETag:
      description: Quoted lowercase SHA-256 digest of the returned representation.
      schema: {type: string, pattern: '^"[0-9a-f]{64}"$'}
  schemas:
    PublicationPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: {$ref: ../schemas/dataset-publication-v1.schema.json}
        page: {type: integer, minimum: 0}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    Error:
      $ref: ../schemas/error-v1.schema.json
  responses:
    Unauthorized:
      description: Missing, invalid, or expired bearer token.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Forbidden:
      description: Token lacks dataset.read or access to the requested dataset.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: Dataset, published version, or artifact was not found.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: Dataset version exists but is not published.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
